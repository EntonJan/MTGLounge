                                            {!!lobbyState?.seatOrder && !lobbyState?.mulliganStatus?.[opponentIds[0]]?.completed && (
                                                <p className="text-yellow-400 text-xs font-bold uppercase tracking-wide mb-1">Choosing mulligan...</p>
                                            )}
                                            {(opponentStates[opponentIds[0]].emblems || []).length > 0 && (
                                                <div className="flex flex-wrap gap-1 mb-1">
                                                    {opponentStates[opponentIds[0]].emblems.map(e => (
                                                        <span key={e.instanceId} className="bg-indigo-700/80 border border-indigo-400 text-indigo-100 text-[10px] font-bold px-1.5 py-0.5 rounded" title={e.stage > 0 ? e.stageText[e.stage - 1] : 'Just created'}>
                                                            {e.name} {e.maxStage > 1 ? `${e.stage}/${e.maxStage}` : ''}
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="text-white text-sm space-y-1">
                                                <div>Life: <span className="text-green-400 font-bold text-lg">{opponentStates[opponentIds[0]].life}</span></div>
                                                {/* Breakdown by MY OWN commander(s) - this tracks damage *I've* dealt
                                                    to this opponent, so a Partner pair on my side shows 2 lines. */}
                                                {getCommandersOf(myState).map(cmdr => (
                                                    <div key={cmdr.instanceId} className="text-xs truncate" title={`Damage by ${cmdr.name}`}>
                                                        {cmdr.name}: <span className="text-red-400 font-bold">{(opponentStates[opponentIds[0]].commanderDamage || {})[cmdr.instanceId] || 0}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        {opponentStates[opponentIds[0]].commandZone?.length > 0 && (
                                            <div className="pointer-events-auto bg-red-900/80 backdrop-blur-sm p-3 rounded-lg border border-red-500/50 overflow-hidden flex flex-col shadow-lg">
                                                <h4 className="text-red-400 text-sm font-bold mb-2 flex-shrink-0">Command Zone</h4>
                                                <div className="flex flex-wrap gap-2 content-start">
                                                    {opponentStates[opponentIds[0]].commandZone.map(card => (
                                                        <div key={card.instanceId} className="flex flex-col items-center">
                                                            <CardImage 
                                                                src={card.image_url} 
                                                                className="w-12 h-16 border border-yellow-500 flex-shrink-0"
                                                                onMouseEnter={() => setHoveredCard(card.image_url)}
                                                                onMouseLeave={() => setHoveredCard(null)}
                                                            />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Opponent Right Sidebar (Lib/GY) (Overlay) - same height cap as the left sidebar. */}
                                    <div className="absolute top-4 right-2 z-40 w-56 max-h-[29vh] overflow-y-auto flex flex-col gap-2 pointer-events-none scrollbar-hide">
                                        <div className="pointer-events-auto bg-red-900/80 backdrop-blur-sm p-3 rounded-lg border border-red-500/50 flex flex-col items-center justify-center shadow-lg">
                                            <h4 className="text-red-400 text-sm font-bold mb-1">Library ({opponentStates[opponentIds[0]].library?.length || 0})</h4>
                                            <CardImage isBack={true} className="w-16 h-20" />
                                        </div>
                                        <div className="pointer-events-auto bg-red-900/80 backdrop-blur-sm p-3 rounded-lg border border-red-500/50 flex flex-col items-center justify-center shadow-lg">
                                            <h4 className="text-red-400 text-sm font-bold mb-1">GY ({opponentStates[opponentIds[0]].graveyard?.length || 0}) / Exile ({opponentStates[opponentIds[0]].exile?.length || 0})</h4>
                                            <div className="flex gap-2">
                                                {opponentStates[opponentIds[0]].graveyard?.[0] ? <CardImage src={opponentStates[opponentIds[0]].graveyard[0].image_url} className="w-12 h-16" /> : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                                                {opponentStates[opponentIds[0]].exile?.[0] ? <CardImage src={opponentStates[opponentIds[0]].exile[0].image_url} className="w-12 h-16" /> : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}

                            {/* --- MIDDLE ZONE (SHARED BATTLEFIELD UPPER) --- */}
                            <div style={{ top: '33vh', height: '33vh' }} className="w-full absolute bg-blue-900/10 border-b-2 border-blue-500/30 overflow-hidden">
                                {opponentStates[opponentIds[0]]?.battlefieldUpper?.map(card => (
                                    renderBattlefieldCard(card, 'battlefieldUpper', false)
                                ))}

                                <div 
                                    ref={playerUpperBattlefieldRef}
                                    className="h-full w-full relative"
                                    onDrop={(e) => handleDropOnBattlefield(e, 'upper', playerUpperBattlefieldRef)}
                                    onDragOver={(e) => e.preventDefault()}
                                >
                                    {/* --- REFACTOR: Read from myState --- */}
                                    {(myState.battlefieldUpper || []).map(card => (
                                        renderBattlefieldCard(card, 'battlefieldUpper', true)
                                    ))}
                                </div>
                            </div>
                        </>
                    ) : (
                        /* --- 3-4 PLAYER LAYOUT ---
                           Top 50% of the screen, split among however many opponents are actually seated:
                           - Grid mode (expandedOpponentId === null): all opponent tiles equal width.
                           - Expanded mode: the clicked opponent takes 80% width, the rest share the remaining
                             20% between them (so they never disappear when one tile is enlarged) - per the
                             spec: 10% each at 4 players (3 others), 20% as one tile at 3 players (2 others,
                             so 10% each there too - the remaining tiles always split the 20% evenly).
                           My own battlefield (bottom 50%) merges battlefieldUpper+battlefieldLower into a
                           single unified drop zone - no more internal split on my own side. */
                        <div className="absolute top-0 left-0 w-full h-1/2 bg-gray-950/40 border-b-2 border-red-500/30 z-0 flex gap-1 p-1">
                            {seatedOpponentIds.map(oppId => {
                                const isThisExpanded = expandedOpponentId === oppId;
                                const otherCount = seatedOpponentIds.length - 1;
                                let widthStyle;
                                if (!expandedOpponentId) {
                                    widthStyle = { width: `${100 / seatedOpponentIds.length}%` };
                                } else if (isThisExpanded) {
                                    widthStyle = { width: '80%' };
                                } else {
                                    widthStyle = { width: `${otherCount > 0 ? 20 / otherCount : 20}%` };
                                }
                                return (
                                    <div key={oppId} style={widthStyle} className="h-full transition-all duration-200">
                                        <OpponentTile 
                                            name={getPlayerName(oppId)}
                                            state={opponentStates[oppId]}
                                            isActivePlayer={activePlayerId === oppId}
                                            isChoosingMulligan={!!lobbyState?.seatOrder && !lobbyState?.mulliganStatus?.[oppId]?.completed}
                                            isExpanded={isThisExpanded}
                                            onClick={() => setExpandedOpponentId(isThisExpanded ? null : oppId)}
                                            onHoverCard={setHoveredCard}
                                            myCommanders={getCommandersOf(myState)}
                                        />
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* --- BOTTOM ZONE (MY BATTLEFIELD) ---
                        2-player layout: kept at its original 66vh split (unchanged, see the rich layout above).
                        3-4 player layout: exactly the bottom 50% of the screen, ONE unified drop zone - cards
                        dropped here always land in battlefieldLower; battlefieldUpper is still rendered (for
                        any cards that ended up there from older saves or other code paths) but there's no
                        longer a separate upper drop target to drag onto. */}
                    <div 
                        style={{ top: opponentIds.length <= 1 ? '66vh' : '50%', bottom: 0 }} 
                        className={`w-full absolute overflow-hidden transition-all duration-200 ${
                            activePlayerId === user.uid ? 'ring-4 ring-green-400/70 ring-inset bg-green-900/10' : 'bg-blue-900/20'
                        }`}
                    >
                        <div 
                            ref={playerLowerBattlefieldRef}
                            className="h-full w-full relative"
                            onDrop={(e) => handleDropOnBattlefield(e, 'lower', playerLowerBattlefieldRef)}
                            onDragOver={(e) => e.preventDefault()}
                        >
                            {/* --- REFACTOR: Read from myState --- */}
                            {(myState.battlefieldLower || []).map(card => (
                                renderBattlefieldCard(card, 'battlefieldLower', true)
                            ))}
                            {opponentIds.length > 1 && (myState.battlefieldUpper || []).map(card => (
                                renderBattlefieldCard(card, 'battlefieldUpper', true)
                            ))}
                        </div>
                    </div>

                    {/* --- PLAYER UI OVERLAYS (BOTTOM) --- */}
                    
                    {/* Player Hand */}
                    <div className="absolute bottom-0 left-1/2 transform -translate-x-1/2 z-50">
                        {myHandMinimized ? (
                            <button onClick={() => setMyHandMinimized(false)} className="bg-blue-900/90 backdrop-blur-sm px-4 py-1 rounded-t-lg border border-blue-500/50 text-blue-400 font-bold text-xs shadow-lg hover:bg-blue-800 transition-colors">
                                Maximize Hand
                            </button>
                        ) : (
                            <div className="bg-blue-900/90 backdrop-blur-sm px-4 py-2 rounded-t-lg border-t border-x border-blue-500/50 relative group shadow-xl max-w-[95vw]"
                                onDrop={(e) => handleDropOnZone(e, 'hand')}
                                onDragOver={(e) => e.preventDefault()}
                            >
                                <button onClick={() => setMyHandMinimized(true)} className="absolute top-0 right-0 p-1 text-blue-400 hover:text-white opacity-0 group-hover:opacity-100 transition-opacity" title="Minimize Hand"><i data-lucide="minus" className="w-3 h-3"></i></button>
                                <div className="flex gap-2 items-center h-[18vh] overflow-x-auto scrollbar-hide">
                                    <span className="text-blue-400 text-sm font-bold mr-3 flex-shrink-0">Hand</span>
                                    <div className="flex overflow-x-auto scrollbar-hide gap-2 h-full flex-grow items-center">
                                        {/* --- REFACTOR: Read from myState --- */}
                                        {myState.hand.map(card => (
                                            <div 
                                                key={card.instanceId}
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, card, 'hand')}
                                                className="relative group/handcard cursor-pointer flex-shrink-0"
                                            >
                                                <CardImage 
                                                    src={card.image_url} 
                                                    style={{ width: 'calc((18vh - 8px) * 0.714)', height: 'calc(18vh - 8px)' }}
                                                    className="group-hover/handcard:brightness-110 transition-[filter]"
                                                    onMouseEnter={() => setHoveredCard(card.image_url)}
                                                    onMouseLeave={() => setHoveredCard(null)}
                                                />
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); playCardFromHand(card); }}
                                                    className="absolute bottom-1 inset-x-1 bg-green-600 hover:bg-green-500 text-white text-[10px] font-bold py-1 rounded opacity-0 group-hover/handcard:opacity-100 transition-opacity shadow-lg"
                                                    title={isLand(card) ? 'Play onto your battlefield' : 'Put onto the stack'}
                                                >
                                                    Play
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Player Left Sidebar (Life/Command) - capped to my own bottom-zone height (33vh) so a
                        long Command Zone box never grows up into the middle zone and steals clicks there. */}
                    <div className="absolute bottom-4 left-2 z-40 w-56 max-h-[29vh] overflow-y-auto flex flex-col gap-2 scrollbar-hide">
                        <div className="bg-blue-900/80 backdrop-blur-sm p-4 rounded-lg border border-blue-500/50 flex-shrink-0 shadow-lg">
                            <div className="flex justify-between items-center mb-2">
                                <h4 className="text-blue-400 text-sm font-bold">You</h4>
                                {activePlayerId === user.uid && <ActiveTurnBadge />}
                            </div>
                            <button 
                                onClick={endTurn} 
                                disabled={activePlayerId !== user.uid}
                                title={activePlayerId === user.uid ? "End your turn and pass play to the next player" : "Not your turn"}
                                className={`w-full mb-2 py-1.5 rounded text-xs font-bold transition-colors ${
                                    activePlayerId === user.uid 
                                        ? 'bg-yellow-600 hover:bg-yellow-500 text-white cursor-pointer' 
                                        : 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                }`}
                            >
                                End Turn
                            </button>
                            {myEmblems.length > 0 && (
                                <div className="flex flex-wrap gap-1 mb-2">
                                    {myEmblems.map(e => (
                                        <span 
                                            key={e.instanceId} 
                                            className="bg-indigo-700/80 border border-indigo-400 text-indigo-100 text-[10px] font-bold px-1.5 py-0.5 rounded cursor-default"
                                            title={e.stage > 0 ? e.stageText[e.stage - 1] : 'Just created'}
                                        >
                                            {e.name} {e.maxStage > 1 ? `${e.stage}/${e.maxStage}` : ''}
                                        </span>
                                    ))}
                                </div>
                            )}
                            {/* --- REFACTOR: Read from myState --- */}
                            <div className="text-white text-sm space-y-1">
                                <div className="flex items-center justify-between">
                                    <span>Life:</span>
                                    <span className="text-green-400 font-bold text-lg">{myState.life}</span>
                                </div>
                                <div className="flex gap-1 mb-2">
                                    <button onClick={() => updateMyState({ life: myState.life + 1 })} className="flex-1 bg-green-600 px-2 py-1 rounded text-xs hover:bg-green-500">+</button>
                                    <button onClick={() => updateMyState({ life: myState.life - 1 })} className="flex-1 bg-red-600 px-2 py-1 rounded text-xs hover:bg-red-500">-</button>
                                </div>
                                {/* One counter per ENEMY commander (a Partner opponent gets 2 separate entries,
                                    one per commander, each tracked toward its own 21-damage threshold), titled
                                    with that commander's actual name instead of a generic "Commander Damage". */}
                                {seatedOpponentIds.flatMap(oppId => 
                                    getCommandersOf(opponentStates[oppId]).map(cmdr => ({ oppId, cmdr }))
                                ).map(({ oppId, cmdr }) => {
                                    const dmg = (myState.commanderDamage || {})[cmdr.instanceId] || 0;
                                    return (
                                        <div key={cmdr.instanceId} className="mt-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[11px] truncate pr-1" title={`Damage by ${cmdr.name}`}>Damage by {cmdr.name}</span>
                                                <span className="text-red-400 font-bold flex-shrink-0">{dmg}</span>
                                            </div>
                                            <div className="flex gap-1">
                                                <button 
                                                    onClick={() => {
                                                        const newDmg = dmg + 1;
                                                        updateMyState({ commanderDamage: { ...(myState.commanderDamage || {}), [cmdr.instanceId]: newDmg }, life: myState.life - 1 });
                                                    }} 
                                                    className="flex-1 bg-red-600 px-2 py-1 rounded text-xs hover:bg-red-500"
                                                >+</button>
                                                <button 
                                                    onClick={() => {
                                                        if (dmg > 0) {
                                                            updateMyState({ commanderDamage: { ...(myState.commanderDamage || {}), [cmdr.instanceId]: dmg - 1 }, life: myState.life + 1 });
                                                        }
                                                    }} 
                                                    className="flex-1 bg-green-600 px-2 py-1 rounded text-xs hover:bg-green-500" 
                                                    disabled={!(dmg > 0)}
                                                >-</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        
                        <div 
                            className="bg-blue-900/80 backdrop-blur-sm p-3 rounded-lg border border-blue-500/50 overflow-hidden flex flex-col shadow-lg"
                            onDrop={(e) => handleDropOnZone(e, 'command')}
                            onDragOver={(e) => e.preventDefault()}
                        >
                            <h4 className="text-blue-400 text-sm font-bold mb-2 flex-shrink-0">Command Zone</h4>
                            <div className="flex flex-wrap gap-2 content-start">
                                {/* --- REFACTOR: Read from myState --- */}
                                {myState.commandZone.map(card => (
                                    <div 
                                        key={card.instanceId}
                                        draggable
                                        onDragStart={(e) => handleDragStart(e, card, 'command')}
                                        className="cursor-pointer flex-shrink-0 flex flex-col items-center"
                                    >
                                        <CardImage 
                                            src={card.image_url} 
                                            className="w-12 h-16 hover:scale-110 transition-transform border border-yellow-500"
                                            onMouseEnter={() => setHoveredCard(card.image_url)}
                                            onMouseLeave={() => setHoveredCard(null)}
                                        />
                                        {card.isCommander && (
                                            <div className="text-yellow-400 text-[10px] font-bold mt-1">Tax: {(myState.cmdTax || {})[card.instanceId] || 0}</div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <button onClick={handleLeaveGame} className="w-full bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded text-sm font-bold flex-shrink-0 shadow-lg">Leave Game</button>
                    </div>

                    {/* Player Right Sidebar (Lib/GY/Exile) - same height cap as my left sidebar. */}
                    <div className="absolute bottom-4 right-2 z-40 w-56 max-h-[29vh] overflow-y-auto flex flex-col gap-2 scrollbar-hide">
                        <div 
                            className="bg-blue-900/80 backdrop-blur-sm p-3 rounded-lg border border-blue-500/50 cursor-pointer hover:bg-blue-900 flex-1 flex flex-col items-center justify-center relative shadow-lg"
                            onClick={(e) => setLibraryMenu({ x: e.clientX, y: e.clientY })}
                            onDrop={(e) => handleDropOnZone(e, 'library')}
                            onDragOver={(e) => e.preventDefault()}
                        >
                            {/* --- REFACTOR: Read from myState --- */}
                            <h4 className="text-blue-400 text-sm font-bold mb-2">Library ({myState.library.length})</h4>
                            <CardImage isBack={true} className="w-20 h-28" />
                            <div className="absolute inset-0 bg-blue-500/10 pointer-events-none rounded-lg border-2 border-transparent hover:border-blue-400/50"></div>
                        </div>
                        
                        <div className="flex gap-2">
                            <div 
                                className="bg-blue-900/80 backdrop-blur-sm p-2 rounded-lg border border-blue-500/50 cursor-pointer hover:bg-blue-900 flex-1 flex flex-col items-center justify-center shadow-lg"
                                onClick={() => setViewingZone('graveyard')}
                                onDrop={(e) => handleDropOnZone(e, 'graveyard')}
                                onDragOver={(e) => e.preventDefault()}
                            >
                                {/* --- REFACTOR: Read from myState --- */}
                                <h4 className="text-blue-400 text-xs font-bold mb-1">GY ({myState.graveyard.length})</h4>
                                {myState.graveyard[0] ? (
                                    <CardImage 
                                        src={myState.graveyard[0].image_url} 
                                        className="w-12 h-16"
                                        onMouseEnter={() => setHoveredCard(myState.graveyard[0].image_url)}
                                        onMouseLeave={() => setHoveredCard(null)}
                                    />
                                ) : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                            </div>
                            
                            <div 
                                className="bg-blue-900/80 backdrop-blur-sm p-2 rounded-lg border border-blue-500/50 cursor-pointer hover:bg-blue-900 flex-1 flex flex-col items-center justify-center shadow-lg"
                                onClick={() => setViewingZone('exile')}
                                onDrop={(e) => handleDropOnZone(e, 'exile')}
                                onDragOver={(e) => e.preventDefault()}
                            >
                                {/* --- REFACTOR: Read from myState --- */}
                                <h4 className="text-blue-400 text-xs font-bold mb-1">Exile ({myState.exile.length})</h4>
                                {myState.exile[0] ? (
                                    <CardImage 
                                        src={myState.exile[0].image_url} 
                                        className="w-12 h-16"
                                        onMouseEnter={() => setHoveredCard(myState.exile[0].image_url)}
                                        onMouseLeave={() => setHoveredCard(null)}
                                    />
                                ) : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                            </div>
                        </div>

                        <div className="flex gap-2 flex-shrink-0">
                            <button onClick={drawCard} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg">Draw</button>
                            <button onClick={() => setTokenModalOpen(true)} className="flex-1 bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg">Token</button>
                            <button onClick={shuffleLibrary} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg">Shuffle</button>
                        </div>
                        <button onClick={() => setEmblemModalOpen(true)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg mt-2">Emblems{myEmblems.length > 0 ? ` (${myEmblems.length})` : ''}</button>
                    </div>
                </div>
            );
        };

        // Timer Component for Room List
        const RoomTimer = ({ emptyAt }) => {
            const [timeLeft, setTimeLeft] = useState(0);

            useEffect(() => {
                if (!emptyAt) return;
                const updateTimer = () => {
                    const remaining = Math.max(0, emptyAt - Date.now());
                    setTimeLeft(remaining);
                };
                updateTimer();
                const interval = setInterval(updateTimer, 1000);
                return () => clearInterval(interval);
            }, [emptyAt]);

            if (!emptyAt) return null;

            const seconds = Math.floor(timeLeft / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            const isWarning = timeLeft < 60000;

            return (
                <div className={`text-xs ${isWarning ? 'text-red-400 timer-warning' : 'text-gray-400'}`}>
                    â±ï¸ {minutes}:{remainingSeconds.toString().padStart(2, '0')}
                </div>
            );
        };

        const App = ({ user }) => {
            const [view, setView] = useState('lobby');
            const [selectedDeck, setSelectedDeck] = useState(null);
            const [decks, setDecks] = useState([]);
            const [rooms, setRooms] = useState([]);
            const [currentRoomId, setCurrentRoomId] = useState(null);
            const [maxPlayers, setMaxPlayers] = useState(2); // Chosen by the host when creating a room (2-4)
            
            // --- REFACTOR: Use global db
            const db = window.db;
            const roomsCollectionRef = useMemo(() => window.collection(db, 'arena_rooms'), [db]);

            useEffect(() => {
                const loadDecks = async () => {
                    const deckCollection = window.collection(db, 'users', user.uid, 'decks');
                    const snapshot = await window.getDocs(deckCollection);
                    setDecks(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                };
                loadDecks();

                // Listen to rooms collection
                const unsubscribe = window.onSnapshot(roomsCollectionRef, (snapshot) => {
                    setRooms(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                // Cleanup interval for expired rooms
                const cleanupInterval = setInterval(async () => {
                    const now = Date.now();
                    const roomsSnapshot = await window.getDocs(roomsCollectionRef);
                    
                    roomsSnapshot.docs.forEach(async (docSnap) => {
                        const data = docSnap.data();
                        if (data.emptyAt && data.emptyAt <= now) {
                            console.log(`Deleting expired empty room: ${docSnap.id}`);
                            // --- REFACTOR: Also delete subcollection (though it should be empty)
                            try {
                                const stateQuery = window.query(window.collection(db, 'arena_rooms', docSnap.id, 'game_state'));
                                const stateSnapshot = await window.getDocs(stateQuery);
                                stateSnapshot.forEach(stateDoc => window.deleteDoc(stateDoc.ref));
                            } catch (e) {}
                            await window.deleteDoc(docSnap.ref);
                        }
                    });
                }, 10000);

                return () => {
                    unsubscribe();
                    clearInterval(cleanupInterval);
                };
            }, [db, user.uid, roomsCollectionRef]);

            useEffect(() => { lucide.createIcons(); }, [view, rooms, decks]);

            // --- REFACTOR: createRoom writes minimal data ---
            const createRoom = async () => {
                if (!selectedDeck) { alert("Select a deck first"); return; }
                const roomRef = await window.addDoc(roomsCollectionRef, {
                    host: user.uid, 
                    hostName: user.displayName || user.email.split('@')[0],
                    players: [user.uid], 
                    maxPlayers: maxPlayers,
                    createdAt: Date.now(),
                    emptyAt: null,
                    // REPLACED `playerDecks` with `playerInfo`
                    playerInfo: {
                        [user.uid]: {
                            deckId: selectedDeck.id,
                            deckName: selectedDeck.name,
                            commanderName: getDeckCommanderDisplayName(selectedDeck)
                        }
                    }
                });
                setCurrentRoomId(roomRef.id);
                setView('game');
            };

            // --- REFACTOR: joinRoom writes minimal data ---
            const joinRoom = async (roomId) => {
                if (!selectedDeck) { alert("Select a deck first"); return; }
                const roomRef = window.doc(db, 'arena_rooms', roomId);
                const room = rooms.find(r => r.id === roomId);
                if (!room) return;
                if (room.players.includes(user.uid)) { setCurrentRoomId(roomId); setView('game'); return; } // Already in this room (e.g. rejoining)
                const capacity = room.maxPlayers || 2;
                if (room.players.length >= capacity) { alert("This room is already full."); return; }

                await window.updateDoc(roomRef, { 
                    players: [...room.players, user.uid],
                    emptyAt: null,
                    // REPLACED `playerDecks` with `playerInfo`
                    [`playerInfo.${user.uid}`]: {
                        deckId: selectedDeck.id,
                        deckName: selectedDeck.name,
                        commanderName: getDeckCommanderDisplayName(selectedDeck)
                    }
                });
                setCurrentRoomId(roomId);
                setView('game');
            };

            const deleteRoom = async (roomId, e) => {
                e.stopPropagation();
                if(!confirm("Are you sure you want to delete this room?")) return;
                // --- REFACTOR: Must delete subcollection first ---
                try {
                    const stateQuery = window.query(window.collection(db, 'arena_rooms', roomId, 'game_state'));
                    const stateSnapshot = await window.getDocs(stateQuery);
                    stateSnapshot.forEach(stateDoc => window.deleteDoc(stateDoc.ref));
                } catch (e) { console.error("Error cleaning subcollection:", e); }
                
                await window.deleteDoc(window.doc(db, 'arena_rooms', roomId));
            };

            const clearMyRooms = async () => {
                if(!confirm("This will close ALL rooms where you are the host. Continue?")) return;
                const q = window.query(roomsCollectionRef, window.where('host', '==', user.uid));
                const snapshot = await window.getDocs(q);
                snapshot.forEach(async (docSnap) => {
                    await deleteRoom(docSnap.id, { stopPropagation: () => {} });
                });
            };

// ... (inside the App component)

            // --- REFACTOR: leaveGame must clean up game_state doc ---
            const leaveGame = async () => {
                if (currentRoomId) {
                    const roomRef = window.doc(db, 'arena_rooms', currentRoomId);
                    const myStateRef = window.doc(db, 'arena_rooms', currentRoomId, 'game_state', user.uid);
                    
                    // 1. Delete my game state document (Required to pass the new security rule check)
                    try { 
                        await window.deleteDoc(myStateRef); 
                        console.log("Successfully deleted my player state document.");
                    } catch(e) { 
                        // It's crucial for the user to leave, so we log the error but proceed.
                        console.error("Could not delete my player state document. This might be a temporary permission issue or the document already gone:", e); 
                    }
                    
                    // 2. Update the lobby doc
                    const roomSnap = await window.getDoc(roomRef); // Use getDoc for a single read
                    
                    if (roomSnap.exists()) {
                        const roomData = roomSnap.data();
                        const remainingPlayers = roomData.players.filter(p => p !== user.uid);
                        
                        let updatedPlayerInfo = { ...roomData.playerInfo };
                        delete updatedPlayerInfo[user.uid];

                        if (remainingPlayers.length === 0) {
                            // If I'm the last one, mark room for deletion
                            await window.updateDoc(roomRef, {
                                players: [],
                                playerInfo: {},
                                emptyAt: Date.now() + ROOM_TIMEOUT_MS
                            });
                            console.log("Room marked for cleanup timeout.");
                        } else {
                            // If opponent is still here, just remove me
                            await window.updateDoc(roomRef, {
                                players: remainingPlayers,
                                playerInfo: updatedPlayerInfo,
                                emptyAt: null // No longer empty
                            });
                            console.log("Player removed from room.");
                        }
                    }
                }
                
                setView('lobby');
                setCurrentRoomId(null);
            };

// ... (rest of the App component)

            if (view === 'game' && currentRoomId && selectedDeck) {
                return <GameSim deck={selectedDeck} onLeave={leaveGame} roomId={currentRoomId} />;
            }

            return (
                <div className="h-screen flex flex-col bg-gray-900">
                    <Header user={user} selectedDeck={selectedDeck} />
                    <div className="flex-grow p-8 overflow-y-auto">
                        <div className="max-w-6xl mx-auto">
                            <div className="mb-6">
                                <h2 className="text-3xl font-bold text-yellow-400 mb-4">Select Your Deck</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {decks.map(deck => (
                                        <div 
                                            key={deck.id} 
                                            onClick={() => setSelectedDeck(deck)}
                                            className={`p-4 rounded-lg cursor-pointer transition-all ${
                                                selectedDeck?.id === deck.id 
                                                    ? 'bg-yellow-600 border-2 border-yellow-400' 
                                                    : 'bg-gray-800 border border-gray-700 hover:border-yellow-500'
                                            }`}
                                        >
                                            <h3 className="font-bold text-white">{deck.name}</h3>
                                            <p className="text-sm text-gray-400">{deck.cards?.length || 0} cards</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <h2 className="text-2xl font-bold text-yellow-400 mb-4">Create Room</h2>
                                    <div className="flex flex-col gap-4">
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Number of Players</label>
                                            <div className="flex gap-2">
                                                {[2, 3, 4].map(n => (
                                                    <button
                                                        key={n}
                                                        onClick={() => setMaxPlayers(n)}
                                                        className={`flex-1 py-3 rounded-lg font-bold text-lg border-2 transition-all ${
                                                            maxPlayers === n
                                                                ? 'bg-yellow-600 border-yellow-400 text-white'
                                                                : 'bg-gray-800 border-gray-700 text-gray-300 hover:border-yellow-500'
                                                        }`}
                                                    >
                                                        {n}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <button 
                                            onClick={createRoom}
                                            disabled={!selectedDeck}
                                            className="w-full bg-green-600 hover:bg-green-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-4 px-6 rounded-lg text-lg"
                                        >
                                            <i data-lucide="plus-circle" className="w-6 h-6 inline-block mr-2"></i>
                                            Create New Room
                                        </button>
                                        <button 
                                            onClick={clearMyRooms}
                                            className="w-full bg-red-900/50 hover:bg-red-800/80 border border-red-700 text-red-200 py-3 px-6 rounded-lg text-sm transition-colors"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4 inline-block mr-2"></i>
                                            Clear My Rooms (Cleanup)
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <h2 className="text-2xl font-bold text-yellow-400 mb-4">Available Rooms</h2>
                                    <div className="space-y-2">
                                        {rooms.filter(r => r.players.length < (r.maxPlayers || 2)).map(room => (
                                            <div key={room.id} className={`bg-gray-800 p-4 rounded-lg border ${room.emptyAt ? 'border-red-500/50 bg-red-900/10' : 'border-gray-700'}`}>
                                                <div className="flex justify-between items-center">
                                                    <div>
                                                        <h3 className="font-bold text-white">{room.hostName}'s Room</h3>
                                                        {room.emptyAt ? (
                                                            <div className="flex items-center space-x-2 mt-1">
                                                                <span className="text-red-400 text-sm font-bold">Closing:</span>
                                                                <RoomTimer emptyAt={room.emptyAt} />
                                                            </div>
                                                        ) : (
                                                            <p className="text-sm text-gray-400">{room.players.length}/{room.maxPlayers || 2} players</p>
                                                        )}
                                                    </div>
                                                    
                                                    {room.host === user.uid ? (
                                                        <button 
                                                            onClick={(e) => deleteRoom(room.id, e)}
                                                            className="bg-red-600 hover:bg-red-500 text-white p-2 rounded"
                                                            title="Delete my room"
                                                        >
                                                            <i data-lucide="trash" className="w-5 h-5"></i>
                                                        </button>
                                                    ) : (
                                                        <button 
                                                            onClick={() => joinRoom(room.id)}
                                                            disabled={!selectedDeck || !!room.emptyAt}
                                                            className="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white px-4 py-2 rounded"
                                                        >
                                                            {room.emptyAt ? 'Closing' : 'Join'}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                        {rooms.filter(r => r.players.length < (r.maxPlayers || 2)).length === 0 && (
                                            <p className="text-gray-500 text-center py-8">No rooms available</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
    </script>
</body>
</html>
