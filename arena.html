                                                    onDragStart={(e) => { if (isTopOfStack && entry.ownerId === user.uid && isAuraCard(entry.card)) handleDragStart(e, entry.card, 'stack'); }}
                                                    onMouseEnter={() => setHoveredCard(entry.card.image_url)}
                                                    onMouseLeave={() => setHoveredCard(null)}
                                                    onContextMenu={(e) => {
                                                        if (!isTopOfStack || entry.ownerId !== user.uid) return; // Only the top card, and only your own entries
                                                        e.preventDefault();
                                                        setCardMenu({ x: e.clientX, y: e.clientY, card: entry.card, zone: 'stack' });
                                                    }}
                                                />
                                                <div className="flex flex-col gap-1">
                                                    <span className="text-[10px] text-gray-400">{entry.ownerName}</span>
                                                    {!isTopOfStack && (
                                                        <span className="text-[9px] text-yellow-500 font-bold uppercase">Waiting...</span>
                                                    )}
                                                    {isTopOfStack && isAuraCard(entry.card) && entry.ownerId === user.uid && (
                                                        <p className="text-[9px] text-purple-300">Drag onto a creature</p>
                                                    )}
                                                    {isTopOfStack && entry.ownerId === user.uid && (
                                                        <div className="flex flex-wrap gap-1">
                                                            {entry.isTrigger ? (
                                                                // Triggered ability — just a Resolve button
                                                                <button onClick={() => resolveStackTrigger(entry)} className="bg-green-700 hover:bg-green-600 text-white text-[9px] font-bold py-0.5 px-1.5 rounded">⚡ Resolve Trigger</button>
                                                            ) : (
                                                                <>
                                                                    {!isLand(entry.card) && (
                                                                        <>
                                                                            <button onClick={() => moveStackCardToBattlefield(entry, 'lower')} className="bg-blue-600 hover:bg-blue-500 text-white text-[9px] font-bold py-0.5 px-1.5 rounded">To Battlefield</button>
                                                                            <button onClick={() => moveStackCardToMyZone(entry, 'graveyard')} className="bg-gray-600 hover:bg-gray-500 text-white text-[9px] font-bold py-0.5 px-1.5 rounded">To Graveyard</button>
                                                                            <button onClick={() => moveStackCardToMyZone(entry, 'exile')} className="bg-gray-700 hover:bg-gray-600 text-white text-[9px] font-bold py-0.5 px-1.5 rounded">To Exile</button>
                                                                        </>
                                                                    )}
                                                                    <button onClick={() => returnStackCardToHand(entry)} className="bg-red-700 hover:bg-red-600 text-white text-[9px] font-bold py-0.5 px-1.5 rounded" title="Return this card to your hand">Return to Hand</button>
                                                                </>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {hoveredCard && (() => {
                        const PREVIEW_W = 256; // matches w-64
                        const PREVIEW_H = 350; // matches h-[350px]
                        const OFFSET = 20; // gap between cursor and preview
                        // Default: place it up and to the right of the cursor. Clamp so it never runs off-screen.
                        let left = mousePos.x + OFFSET;
                        let top = mousePos.y - PREVIEW_H - OFFSET;
                        if (left + PREVIEW_W > window.innerWidth) left = mousePos.x - PREVIEW_W - OFFSET; // flip to the left of the cursor
                        if (left < 0) left = 8;
                        if (top < 0) top = mousePos.y + OFFSET; // flip below the cursor if there's no room above
                        if (top + PREVIEW_H > window.innerHeight) top = window.innerHeight - PREVIEW_H - 8;
                        return (
                            <div 
                                className="fixed z-[100] pointer-events-none w-64 h-[350px] rounded-xl overflow-hidden shadow-2xl border-2 border-yellow-500 bg-black"
                                style={{ left, top }}
                            >
                                <img src={hoveredCard} className="w-full h-full object-contain" />
                            </div>
                        );
                    })()}
                    <TokenModal 
                        isOpen={isTokenModalOpen} 
                        onClose={() => setTokenModalOpen(false)} 
                        onCreate={(targetPlayerId, tokenSpec) => requestTokenForPlayer(targetPlayerId, tokenSpec)}
                        seatedPlayers={allPlayersSeated}
                        getPlayerName={getPlayerName}
                        myUid={user.uid}
                    />
                    {cardMenu && (
                        <ContextMenu 
                            x={cardMenu.x} y={cardMenu.y} 
                            onClose={() => setCardMenu(null)}
                            options={generateCardOptions(cardMenu.card, cardMenu.zone)} 
                        />
                    )}
                    {libraryMenu && (
                        <ContextMenu 
                            x={libraryMenu.x} y={libraryMenu.y} 
                            onClose={() => setLibraryMenu(null)}
                            options={[
                                { label: 'Draw Card', action: drawCard },
                                { label: 'Look at Top Card', action: () => { if(myState.library.length>0) setTopCardView(myState.library[0]); } },
                                { label: 'Scry...', submenu: [1,2,3,4,5,7,10].map(n => ({ label: `Scry ${n}`, action: () => { openLibraryAction('scry', n); setLibraryMenu(null); } })) },
                                { label: 'Surveil...', submenu: [1,2,3,4,5,7,10].map(n => ({ label: `Surveil ${n}`, action: () => { openLibraryAction('surveil', n); setLibraryMenu(null); } })) },
                                { label: 'Look at Top X...', submenu: [2,3,4,5,6,7,10,15].map(n => ({ label: `Look at top ${n}`, action: () => { openLibraryAction('look', n); setLibraryMenu(null); } })) },
                                { label: 'Shuffle Library', action: shuffleLibrary },
                                { label: 'View Entire Library', action: () => setViewingZone('library') }
                            ]} 
                        />
                    )}

                    {topCardView && (
                        <Modal isOpen={true} onClose={() => setTopCardView(null)} title="Top of Library">
                            <div className="flex flex-col items-center gap-4">
                                <img src={topCardView.image_url} className="w-48 rounded-xl shadow-lg" />
                                <div className="flex gap-4">
                                    <button onClick={() => { setTopCardView(null); }} className="bg-blue-600 px-4 py-2 rounded text-white">Keep on Top</button>
                                    <button onClick={() => { moveCardToZone(topCardView, 'library_bottom'); setTopCardView(null); }} className="bg-yellow-600 px-4 py-2 rounded text-white">Put on Bottom</button>
                                    <button onClick={() => { playCard(topCardView, 'library_top', 'lower'); setTopCardView(null); }} className="bg-green-600 px-4 py-2 rounded text-white">Play</button>
                                </div>
                            </div>
                        </Modal>
                    )}

                    {viewingZone && (() => {
                        const isOpp = viewingZone.playerId && viewingZone.playerId !== user.uid;
                        const zoneName = viewingZone.zone || viewingZone;
                        const playerName = isOpp ? getPlayerName(viewingZone.playerId) : 'Your';
                        const cards = isOpp
                            ? (opponentStates[viewingZone.playerId]?.[zoneName] || [])
                            : (myState[zoneName] || []);
                        return (
                            <Modal isOpen={true} onClose={() => setViewingZone(null)} title={`${playerName} ${zoneName.charAt(0).toUpperCase() + zoneName.slice(1)} (${cards.length})`}>
                                <div className="grid grid-cols-4 gap-4">
                                    {cards.map((card, idx) => (
                                        <div key={idx} className="relative group">
                                            <img src={card.image_url} className="w-full rounded-lg shadow-lg" />
                                            {!isOpp && (
                                                <div className="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center gap-2 transition-opacity">
                                                    <button onClick={() => { playCard(card, zoneName, 'lower'); }} className="bg-green-600 px-3 py-1 rounded text-xs font-bold text-white hover:bg-green-500">Play</button>
                                                    {zoneName === 'library' && (
                                                        <button onClick={() => { moveCardToZone(card, 'library_top'); setViewingZone(null); }} className="bg-yellow-600 px-3 py-1 rounded text-xs font-bold text-white hover:bg-yellow-500">Top</button>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                    {cards.length === 0 && <p className="col-span-4 text-gray-400 text-center py-8">Empty</p>}
                                </div>
                            </Modal>
                        );
                    })()}

                    {leaveGameModal && (
                        <Modal isOpen={true} onClose={() => setLeaveGameModal(false)} title="Game Result">
                            {/* --- REFACTOR: Read gameResult from lobbyState --- */}
                            {!lobbyState?.gameResult?.submittedBy ? (
                                <div className="flex flex-col items-center gap-4">
                                    <p className="text-white text-lg">Who won the game?</p>
                                    <div className="flex flex-wrap justify-center gap-3">
                                        <button onClick={() => { submitGameResult(user.uid); }} className="bg-green-600 hover:bg-green-500 px-6 py-3 rounded text-white font-bold">I Won</button>
                                        {opponentIds.map(oppId => (
                                            <button key={oppId} onClick={() => { submitGameResult(oppId); }} className="bg-red-600 hover:bg-red-500 px-6 py-3 rounded text-white font-bold">{getPlayerName(oppId)} Won</button>
                                        ))}
                                        <button onClick={() => { submitGameResult('draw'); }} className="bg-gray-600 hover:bg-gray-500 px-6 py-3 rounded text-white font-bold">Draw</button>
                                    </div>
                                </div>
                            ) : lobbyState.gameResult.submittedBy === user.uid ? (
                                <div className="flex flex-col items-center gap-4">
                                    <p className="text-white text-lg">Waiting for the table to confirm result...</p>
                                    <div className="loader"></div>
                                </div>
                            ) : (
                                <div className="flex flex-col items-center gap-4">
                                    <p className="text-white text-lg">
                                        {gameResult.winner === user.uid ? 'You won!' : 
                                         gameResult.winner === 'draw' ? 'Game was a draw' :
                                         `${getPlayerName(gameResult.winner)} won!`}
                                    </p>
                                    <p className="text-gray-400">Do you confirm this result?</p>
                                    <div className="flex gap-4">
                                        <button onClick={confirmGameResult} className="bg-green-600 hover:bg-green-500 px-6 py-3 rounded text-white font-bold">Confirm</button>
                                        <button onClick={() => setLeaveGameModal(false)} className="bg-red-600 hover:bg-red-500 px-6 py-3 rounded text-white font-bold">Dispute</button>
                                    </div>
                                </div>
                            )}
                        </Modal>
                    )}

                    {/* --- OPPONENT AREA: rich single-opponent layout for 2-player games, compact grid for 3-4 players --- */}
                    {opponentIds.length <= 1 ? (
                        <>
                            {/* --- OPPONENT ZONE (TOP HALF) --- */}
                            <div className={`absolute top-0 left-0 w-full h-1/2 border-b-2 z-0 transition-all duration-200 flex flex-col ${
                                activePlayerId === opponentIds[0] ? 'ring-4 ring-green-400/70 ring-inset bg-green-900/10 border-green-500/30' : 'bg-red-900/10 border-red-500/30'
                            }`}>
                                {opponentStates[opponentIds[0]] ? (() => {
                                    const opp = opponentStates[opponentIds[0]];
                                    const allBF = [...(opp.battlefieldLower || []), ...(opp.battlefieldUpper || [])];
                                    const byZone = (t) => allBF.filter(c => getCardZoneType(c) === t);
                                    // Render a card as a simple image-in-flow (not absolute positioned).
                                    // Tapped cards get a 90° rotation via CSS.
                                    const oppCard = (card) => (
                                        <div key={card.instanceId} className="relative flex-shrink-0"
                                            onMouseEnter={() => setHoveredCard(card.image_url)}
                                            onMouseLeave={() => setHoveredCard(null)}
                                        >
                                            <CardImage src={card.image_url}
                                                className={`w-[72px] h-[100px] card-shadow ${card.isTapped ? 'tapped' : 'untapped'}`}
                                            />
                                            {card.counters?.length > 0 && (
                                                <div className="absolute top-0 right-0 flex flex-col gap-0.5">
                                                    {card.counters.map(c => (
                                                        <span key={c.type} className="bg-black/80 text-white text-[8px] px-1 rounded">{c.type} {c.count}</span>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                    return (
                                        // Indent by 240px on each side to leave room for the sidebars
                                        <div className="flex flex-col h-full overflow-hidden" style={{ paddingLeft: 244, paddingRight: 244 }}>
                                            {/* Creature zone — biggest area */}
                                            <div className="flex-grow border-b border-red-500/10 p-1 overflow-hidden">
                                                <div className="text-[8px] text-green-400/40 font-bold uppercase mb-0.5">Creatures</div>
                                                <div className="flex flex-wrap gap-1">
                                                    {byZone('creature').map(oppCard)}
                                                </div>
                                            </div>
                                            {/* Land (65%) + Planeswalker (35%) row */}
                                            <div className="flex border-b border-red-500/10 flex-shrink-0" style={{ minHeight: CARD_H + 8 }}>
                                                <div style={{ flex: '65 1 0' }} className="p-1 border-r border-red-500/10 overflow-hidden">
                                                    <div className="text-[7px] text-yellow-400/40 font-bold uppercase">Lands</div>
                                                    <div className="flex flex-wrap gap-1">{byZone('land').map(oppCard)}</div>
                                                </div>
                                                <div style={{ flex: '35 1 0' }} className="p-1 overflow-hidden">
                                                    <div className="text-[7px] text-red-300/40 font-bold uppercase">Planeswalker</div>
                                                    <div className="flex flex-wrap gap-1">{byZone('planeswalker').map(oppCard)}</div>
                                                </div>
                                            </div>
                                            {/* Enchantment (50%) + Artifact (50%) row */}
                                            <div className="flex flex-shrink-0" style={{ minHeight: CARD_H + 8 }}>
                                                <div className="flex-1 p-1 border-r border-red-500/10 overflow-hidden">
                                                    <div className="text-[7px] text-purple-400/40 font-bold uppercase">Enchant</div>
                                                    <div className="flex flex-wrap gap-1">{byZone('enchantment').map(oppCard)}</div>
                                                </div>
                                                <div className="flex-1 p-1 overflow-hidden">
                                                    <div className="text-[7px] text-orange-400/40 font-bold uppercase">Artifacts</div>
                                                    <div className="flex flex-wrap gap-1">{byZone('artifact').map(oppCard)}</div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })() : (
                                    <div className="flex items-center justify-center h-full text-red-500/20 text-sm font-bold uppercase tracking-widest">Opponent Territory</div>
                                )}
                            </div>

                            {opponentStates[opponentIds[0]] && (
                                <>
                                    {/* Opponent Left Sidebar — runs from top of opponent half to just above
                                        the hand toggle button (which sits at the very bottom of the half) */}
                                    <div className="absolute top-2 left-2 z-40 w-56 flex flex-col gap-2 pointer-events-none scrollbar-hide" style={{ maxHeight: 'calc(50vh - 52px)', overflowY: 'auto' }}>
                                        <div className="pointer-events-auto bg-red-900/80 backdrop-blur-sm p-4 rounded-lg border border-red-500/50 flex-shrink-0 shadow-lg">
                                            <div className="flex justify-between items-center mb-2">
                                                <h4 className="text-red-400 text-sm font-bold">{getPlayerName(opponentIds[0])}</h4>
                                                {activePlayerId === opponentIds[0] && <ActiveTurnBadge />}
                                            </div>
                                            {!!lobbyState?.seatOrder && !lobbyState?.mulliganStatus?.[opponentIds[0]]?.completed && (
                                                <p className="text-yellow-400 text-xs font-bold uppercase tracking-wide mb-1">Choosing mulligan...</p>
                                            )}
                                            {(opponentStates[opponentIds[0]].emblems || []).length > 0 && (
                                                <div className="flex flex-wrap gap-1 mb-1">
                                                    {opponentStates[opponentIds[0]].emblems.map(e => (
                                                        <span key={e.instanceId} className="bg-indigo-700/80 border border-indigo-400 text-indigo-100 text-[10px] font-bold px-1.5 py-0.5 rounded">
                                                            {e.name} {e.maxStage > 1 ? `${e.stage}/${e.maxStage}` : ''}
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="text-white text-sm space-y-1">
                                                <div>Life: <span className="text-green-400 font-bold text-lg">{opponentStates[opponentIds[0]].life}</span></div>
                                                {getCommandersOf(myState).map(cmdr => (
                                                    <div key={cmdr.instanceId} className="text-xs truncate" title={`Damage by ${cmdr.name}`}>
                                                        {cmdr.name}: <span className="text-red-400 font-bold">{(opponentStates[opponentIds[0]].commanderDamage || {})[cmdr.instanceId] || 0}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {opponentStates[opponentIds[0]].commandZone?.length > 0 && (
                                            <div className="pointer-events-auto bg-red-900/80 backdrop-blur-sm p-3 rounded-lg border border-red-500/50 flex-shrink-0 shadow-lg">
                                                <h4 className="text-red-400 text-sm font-bold mb-2">Command Zone</h4>
                                                <div className="flex flex-wrap gap-2 content-start">
                                                    {opponentStates[opponentIds[0]].commandZone.map(card => (
                                                        <div key={card.instanceId} className="flex flex-col items-center">
                                                            <CardImage
                                                                src={card.image_url}
                                                                className="w-14 h-20 border border-yellow-500 flex-shrink-0"
                                                                onMouseEnter={() => setHoveredCard(card.image_url)}
                                                                onMouseLeave={() => setHoveredCard(null)}
                                                            />
                                                            {card.isCommander && (opponentStates[opponentIds[0]].cmdTax || {})[card.instanceId] !== undefined && (
                                                                <span className="text-yellow-400 text-[9px] font-bold">+{(opponentStates[opponentIds[0]].cmdTax || {})[card.instanceId] || 0}</span>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* Hand toggle — ref'd so portal can measure its position */}
                                        <button
                                            ref={oppHandBtnRef}
                                            onClick={() => setOppHandMinimized(o => !o)}
                                            className="pointer-events-auto w-full flex items-center justify-between px-3 py-2 bg-red-800/80 hover:bg-red-700 border border-red-500/60 rounded-lg text-red-300 font-bold text-sm shadow-lg transition-colors flex-shrink-0"
                                        >
                                            <span>Hand ({opponentStates[opponentIds[0]].hand?.length || 0})</span>
                                            <span>{oppHandMinimized ? '▶' : '◀'}</span>
                                        </button>
                                    </div>

                                    {/* Opponent Hand — portal into document.body to escape overflow clipping,
                                        positioned via the button ref so it sits flush-right of the toggle */}
                                    {!oppHandMinimized && oppHandBtnRef.current && ReactDOM.createPortal(
                                        (() => {
                                            const r = oppHandBtnRef.current.getBoundingClientRect();
                                            return (
                                                <div style={{ position: 'fixed', zIndex: 9998, left: r.right + 8, top: r.top, maxWidth: `calc(100vw - ${r.right + 16}px)` }}>
                                                    <div style={{ background: 'rgba(127,29,29,0.95)', backdropFilter: 'blur(8px)', border: '1px solid rgba(239,68,68,0.5)', borderRadius: 8, padding: '8px 16px', boxShadow: '0 20px 40px rgba(0,0,0,0.6)' }}>
                                                        <div className="flex gap-2 items-center h-[18vh] overflow-x-auto scrollbar-hide">
                                                            {Array(Math.min(opponentStates[opponentIds[0]].hand?.length || 0, 20)).fill(0).map((_, i) => (
                                                                <CardImage key={i} isBack={true} className="flex-shrink-0" style={{ width: 'calc((18vh - 8px) * 0.714)', height: 'calc(18vh - 8px)' }} />
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })(),
                                        document.body
                                    )}
                                    {/* Opponent Right Sidebar — full height of opponent half */}
                                    <div className="absolute top-2 right-2 z-40 w-56 flex flex-col gap-2 pointer-events-none scrollbar-hide" style={{ bottom: 'calc(50% + 8px)', overflowY: 'auto' }}>
                                        <div className="pointer-events-auto bg-red-900/80 backdrop-blur-sm p-3 rounded-lg border border-red-500/50 flex flex-col items-center justify-center shadow-lg">
                                            <h4 className="text-red-400 text-sm font-bold mb-1">Library ({opponentStates[opponentIds[0]].library?.length || 0})</h4>
                                            <CardImage isBack={true} className="w-16 h-20" />
                                        </div>
                                        <div className="pointer-events-auto flex gap-2 flex-shrink-0">
                                            <div onClick={() => setViewingZone({ zone: 'graveyard', playerId: opponentIds[0] })} className="flex-1 bg-red-900/80 backdrop-blur-sm p-2 rounded-lg border border-red-500/50 flex flex-col items-center cursor-pointer hover:bg-red-800 shadow-lg">
                                                <h4 className="text-red-400 text-xs font-bold mb-1">GY ({opponentStates[opponentIds[0]].graveyard?.length || 0})</h4>
                                                {opponentStates[opponentIds[0]].graveyard?.[0] ? <CardImage src={opponentStates[opponentIds[0]].graveyard[0].image_url} className="w-12 h-16" /> : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                                            </div>
                                            <div onClick={() => setViewingZone({ zone: 'exile', playerId: opponentIds[0] })} className="flex-1 bg-red-900/80 backdrop-blur-sm p-2 rounded-lg border border-red-500/50 flex flex-col items-center cursor-pointer hover:bg-red-800 shadow-lg">
                                                <h4 className="text-red-400 text-xs font-bold mb-1">Exile ({opponentStates[opponentIds[0]].exile?.length || 0})</h4>
                                                {opponentStates[opponentIds[0]].exile?.[0] ? <CardImage src={opponentStates[opponentIds[0]].exile[0].image_url} className="w-12 h-16" /> : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}
                        </>
                    ) : (
                        /* --- 3-4 PLAYER LAYOUT ---
                           Top 50% of the screen, split among however many opponents are actually seated:
                           - Grid mode (expandedOpponentId === null): all opponent tiles equal width.
                           - Expanded mode: the clicked opponent takes 80% width, the rest share the remaining
                             20% between them (so they never disappear when one tile is enlarged) - per the
                             spec: 10% each at 4 players (3 others), 20% as one tile at 3 players (2 others,
                             so 10% each there too - the remaining tiles always split the 20% evenly).
                           My own battlefield (bottom 50%) merges battlefieldUpper+battlefieldLower into a
                           single unified drop zone - no more internal split on my own side. */
                        <div className="absolute top-0 left-0 w-full h-1/2 bg-gray-950/40 border-b-2 border-red-500/30 z-0 flex gap-1 p-1">
                            {seatedOpponentIds.map(oppId => {
                                const isThisExpanded = expandedOpponentId === oppId;
                                const otherCount = seatedOpponentIds.length - 1;
                                let widthStyle;
                                if (!expandedOpponentId) {
                                    widthStyle = { width: `${100 / seatedOpponentIds.length}%` };
                                } else if (isThisExpanded) {
                                    widthStyle = { width: '80%' };
                                } else {
                                    widthStyle = { width: `${otherCount > 0 ? 20 / otherCount : 20}%` };
                                }
                                return (
                                    <div key={oppId} style={widthStyle} className="h-full transition-all duration-200">
                                        <OpponentTile 
                                            name={getPlayerName(oppId)}
                                            state={opponentStates[oppId]}
                                            isActivePlayer={activePlayerId === oppId}
                                            isChoosingMulligan={!!lobbyState?.seatOrder && !lobbyState?.mulliganStatus?.[oppId]?.completed}
                                            isExpanded={isThisExpanded}
                                            onClick={() => setExpandedOpponentId(isThisExpanded ? null : oppId)}
                                            onHoverCard={setHoveredCard}
                                            myCommanders={getCommandersOf(myState)}
                                        />
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* --- BOTTOM ZONE (MY BATTLEFIELD) ---
                        Now a flat 50% of the screen for both the 2-player and 3-4-player layouts - the old
                        shared middle zone is gone, so battlefieldUpper and battlefieldLower both render here
                        together as ONE unified drop zone (cards dropped here always land in battlefieldLower;
                        battlefieldUpper is still rendered for any cards already there from before this change
                        or from other code paths, but there's no separate upper drop target anymore). */}
                    {/* ── MY HALF ─────────────────────────────────────────────────────────
                         This wrapper owns the bottom 50% of the screen. Everything inside
                         (battlefield, hand, sidebars) uses absolute positioning relative to
                         THIS div, so top:0 = my top edge, bottom:0 = screen bottom.       */}
                    <div style={{ position: 'absolute', top: '50%', bottom: 0, left: 0, right: 0 }}
                        className={`transition-all duration-200 ${activePlayerId === user.uid ? 'ring-4 ring-green-400/70 ring-inset bg-green-900/10' : 'bg-blue-900/20'}`}
                    >
                        {/* Battlefield drop surface */}
                        <div 
                            ref={playerLowerBattlefieldRef}
                            className="absolute inset-0"
                            onDrop={(e) => handleDropOnBattlefield(e, 'lower', playerLowerBattlefieldRef)}
                            onDragOver={(e) => e.preventDefault()}
                        >
                            {zoneBounds && (() => {
                                const { leftSidebarRightX, rightSidebarLeftX, bfWidth, bfHeight } = zoneBounds;
                                const label = (text, color) => <span style={{ fontSize: 9, fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '0.05em', opacity: 0.5, whiteSpace: 'nowrap', position: 'absolute', top: 2, left: 4, color }}>{text}</span>;
                                const box = (style, color, children) => <div style={{ position: 'absolute', border: `1px dashed ${color}`, borderRadius: 3, pointerEvents: 'none', ...style }}>{children}</div>;
                                const zW = rightSidebarLeftX - leftSidebarRightX;
                                const landSplit = leftSidebarRightX + zW * 0.65;
                                const halfSplit = leftSidebarRightX + zW * 0.50;
                                const rowBottom = bfHeight - CARD_H;
                                return (
                                    <div className="absolute inset-0 pointer-events-none z-0">
                                        {box({ left: leftSidebarRightX, width: zW, top: 0, height: rowBottom - CARD_H }, 'rgba(74,222,128,0.3)', label('Creatures', '#bbf7d0'))}
                                        {box({ left: leftSidebarRightX, width: landSplit - leftSidebarRightX, top: rowBottom - CARD_H, height: CARD_H }, 'rgba(234,179,8,0.3)', label('Lands', '#fde68a'))}
                                        {box({ left: landSplit, width: rightSidebarLeftX - landSplit, top: rowBottom - CARD_H, height: CARD_H }, 'rgba(239,68,68,0.3)', label('Planeswalker', '#fca5a5'))}
                                        {box({ left: leftSidebarRightX, width: halfSplit - leftSidebarRightX, top: rowBottom, height: CARD_H }, 'rgba(168,85,247,0.3)', label('Enchant', '#d8b4fe'))}
                                        {box({ left: halfSplit, width: rightSidebarLeftX - halfSplit, top: rowBottom, height: CARD_H }, 'rgba(249,115,22,0.3)', label('Artifacts', '#fed7aa'))}
                                    </div>
                                );
                            })()}
                            {(myState.battlefieldLower || []).map(card => renderBattlefieldCard(card, 'battlefieldLower', true))}
                            {(myState.battlefieldUpper || []).map(card => renderBattlefieldCard(card, 'battlefieldUpper', true))}
                        </div>

                        {/* ── PLAYER UI OVERLAYS ─────────────────────────────────────── */}

                        {/* Hand toggle button — always visible in the bottom-left free area next to the You sidebar */}
                        <button
                            onClick={() => setMyHandMinimized(!myHandMinimized)}
                            style={{ position: 'absolute', bottom: 8, left: 8, width: 224 }}
                            className="z-50 bg-blue-800/90 hover:bg-blue-700 backdrop-blur-sm border border-blue-500/60 rounded-lg py-2 px-3 flex items-center justify-between text-blue-300 font-bold text-sm shadow-lg transition-colors"
                        >
                            <span>Hand ({myState.hand.length})</span>
                            <span className="text-lg">{myHandMinimized ? '▶' : '◀'}</span>
                        </button>

                        {/* Hand zone — slides in from the left when open */}
                        {!myHandMinimized && (
                            <div style={{ position: 'absolute', bottom: 0, left: 240 }} className="z-50">
                                <div className="bg-blue-900/90 backdrop-blur-sm px-4 py-2 rounded-t-lg border-t border-x border-blue-500/50 relative shadow-xl max-w-[calc(100vw-464px)]"
                                    ref={myHandZoneRef}
                                    onDrop={(e) => handleDropOnZone(e, 'hand')}
                                    onDragOver={(e) => e.preventDefault()}
                                >
                                    <div className="flex gap-2 items-center h-[18vh] overflow-x-auto" style={{ scrollbarWidth:'thin', scrollbarColor:'rgba(99,102,241,0.5) rgba(30,27,75,0.3)' }}>
                                        <div className="flex overflow-x-visible gap-2 h-full flex-grow items-center" style={{ minWidth: 'max-content' }}>
                                            {myState.hand.map(card => (
                                                <div 
                                                    key={card.instanceId}
                                                    draggable
                                                    onDragStart={(e) => handleDragStart(e, card, 'hand')}
                                                    className="relative group/handcard cursor-pointer flex-shrink-0"
                                                >
                                                    <CardImage 
                                                        src={card.image_url} 
                                                        style={{ width: 'calc((18vh - 8px) * 0.714)', height: 'calc(18vh - 8px)' }}
                                                        className="group-hover/handcard:brightness-110 transition-[filter]"
                                                        onMouseEnter={() => setHoveredCard(card.image_url)}
                                                        onMouseLeave={() => setHoveredCard(null)}
                                                    />
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); playCardFromHand(card); }}
                                                        className="absolute bottom-1 inset-x-1 bg-green-600 hover:bg-green-500 text-white text-[10px] font-bold py-1 rounded opacity-0 group-hover/handcard:opacity-100 transition-opacity shadow-lg"
                                                        title={isLand(card) ? 'Play onto your battlefield' : 'Put onto the stack'}
                                                    >Play</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Left sidebar (You / Life / Command Zone) — top to just above hand */}
                        <div ref={myLeftSidebarRef} style={{ position: 'absolute', top: 4, bottom: 4, left: 8 }} className="z-40 w-56 overflow-y-auto flex flex-col gap-2 scrollbar-hide">
                            {/* You / Life / Commander Damage */}
                            <div className="bg-blue-900/80 backdrop-blur-sm p-4 rounded-lg border border-blue-500/50 flex-shrink-0 shadow-lg">
                                <div className="flex justify-between items-center mb-2">
                                    <h4 className="text-blue-400 text-sm font-bold">You</h4>
                                    {activePlayerId === user.uid && <ActiveTurnBadge />}
                                </div>
                                <div className="flex gap-1 mb-2">
                                    <button 
                                        onClick={endTurn} 
                                        disabled={activePlayerId !== user.uid}
                                        className={`flex-1 py-1.5 rounded text-xs font-bold transition-colors ${activePlayerId === user.uid ? 'bg-yellow-600 hover:bg-yellow-500 text-white cursor-pointer' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}`}
                                    >End Turn</button>
                                    <button
                                        onClick={() => {
                                            if (!combatState) startCombat();
                                            else if (combatState.phase === 'blocking' && combatState.attackerId !== user.uid) passPriority();
                                            else endCombat();
                                        }}
                                        disabled={activePlayerId !== user.uid && !(combatState?.phase === 'blocking' && combatState.attackerId !== user.uid)}
                                        className={`flex-1 py-1.5 rounded text-xs font-bold transition-colors ${
                                            combatState?.phase === 'blocking' && combatState.attackerId !== user.uid
                                                ? 'bg-yellow-600 hover:bg-yellow-500 text-white cursor-pointer'
                                                : activePlayerId !== user.uid
                                                ? 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                                : combatState ? 'bg-red-700 hover:bg-red-600 text-white' : 'bg-red-900 hover:bg-red-700 text-red-300'
                                        }`}
                                    >
                                        {combatState?.phase === 'blocking' && combatState.attackerId !== user.uid
                                            ? '🛡️ No Blocker'
                                            : combatState ? '⚔️ End Combat' : '⚔️ Attack'}
                                    </button>
                                </div>
                                <ManaPool pool={manaPool} onAdd={addMana} onRemove={removeMana} onClear={clearMana} />
                                {myEmblems.length > 0 && (
                                    <div className="flex flex-wrap gap-1 mb-2">
                                        {myEmblems.map(e => (
                                            <span key={e.instanceId} className="bg-indigo-700/80 border border-indigo-400 text-indigo-100 text-[10px] font-bold px-1.5 py-0.5 rounded cursor-default" title={e.stage > 0 ? e.stageText[e.stage - 1] : 'Just created'}>
                                                {e.name} {e.maxStage > 1 ? `${e.stage}/${e.maxStage}` : ''}
                                            </span>
                                        ))}
                                    </div>
                                )}
                                <div className="text-white text-sm space-y-1">
                                    <div className="flex items-center justify-between">
                                        <span>Life:</span>
                                        <span className="text-green-400 font-bold text-lg">{myState.life}</span>
                                    </div>
                                    <div className="flex gap-1 mb-2">
                                        <button onClick={() => updateMyState({ life: myState.life + 1 })} className="flex-1 bg-green-600 px-2 py-1 rounded text-xs hover:bg-green-500">+</button>
                                        <button onClick={() => updateMyState({ life: myState.life - 1 })} className="flex-1 bg-red-600 px-2 py-1 rounded text-xs hover:bg-red-500">-</button>
                                    </div>
                                </div>
                            </div>

                            {/* Commander Damage — rendered via React portal into document.body to escape
                                the overflow:hidden on the GameSim root div that clips fixed children */}
                            <div className="relative flex-shrink-0">
                                <button
                                    onClick={() => setCmdDmgOpen(o => !o)}
                                    className="w-full flex items-center justify-between px-3 py-2 bg-blue-900/80 backdrop-blur-sm rounded-lg border border-blue-500/50 text-blue-400 text-sm font-bold hover:bg-blue-800/60 transition-colors shadow-lg"
                                >
                                    <span>Commander Damage</span>
                                    <span>{cmdDmgOpen ? '◀' : '▶'}</span>
                                </button>
                                {cmdDmgOpen && ReactDOM.createPortal(
                                    <div style={{ position: 'fixed', zIndex: 9999, left: 244, top: 'calc(50% + 4px)', width: 260, maxHeight: '45vh', overflowY: 'auto', background: '#111827', border: '2px solid #3b82f6', borderRadius: 8, padding: 12, boxShadow: '0 25px 50px rgba(0,0,0,0.8)', display: 'flex', flexDirection: 'column', gap: 8 }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                            <span style={{ color: '#60a5fa', fontSize: 11, fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Cmd Damage Tracker</span>
                                            <button onClick={() => setCmdDmgOpen(false)} style={{ color: '#9ca3af', background: 'none', border: 'none', cursor: 'pointer', fontSize: 14 }}>✕</button>
                                        </div>
                                        {seatedOpponentIds.length === 0 && (
                                            <p style={{ color: '#6b7280', fontSize: 11, textAlign: 'center', padding: '8px 0' }}>No opponents seated yet</p>
                                        )}
                                        {seatedOpponentIds.map(oppId => {
                                            const oppState = opponentStates[oppId];
                                            const commanders = oppState ? getCommandersOf(oppState) : [];
                                            if (!oppState) return <p key={oppId} style={{ color: '#9ca3af', fontSize: 11 }}>Waiting for {getPlayerName(oppId)}...</p>;
                                            if (commanders.length === 0) return <p key={oppId} style={{ color: '#9ca3af', fontSize: 11, borderTop: '1px solid #374151', paddingTop: 8 }}>{getPlayerName(oppId)}: game not started yet</p>;
                                            return commanders.map(cmdr => {
                                                const dmg = (myState.commanderDamage || {})[cmdr.instanceId] || 0;
                                                return (
                                                    <div key={cmdr.instanceId} style={{ borderTop: '1px solid #374151', paddingTop: 8 }}>
                                                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                                                            <span style={{ color: 'white', fontSize: 11, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', paddingRight: 4 }} title={cmdr.name}>{cmdr.name}</span>
                                                            <span style={{ color: dmg >= 21 ? '#f87171' : '#fca5a5', fontWeight: 'bold', flexShrink: 0 }}>{dmg}{dmg >= 21 ? ' ☠' : ''}</span>
                                                        </div>
                                                        <div style={{ display: 'flex', gap: 4 }}>
                                                            <button onClick={() => updateMyState({ commanderDamage: { ...(myState.commanderDamage || {}), [cmdr.instanceId]: dmg + 1 }, life: myState.life - 1 })} style={{ flex: 1, background: '#dc2626', color: 'white', border: 'none', borderRadius: 4, padding: '4px 0', cursor: 'pointer', fontSize: 11 }}>+</button>
                                                            <button onClick={() => { if (dmg > 0) updateMyState({ commanderDamage: { ...(myState.commanderDamage || {}), [cmdr.instanceId]: dmg - 1 }, life: myState.life + 1 }); }} style={{ flex: 1, background: '#16a34a', color: 'white', border: 'none', borderRadius: 4, padding: '4px 0', cursor: dmg > 0 ? 'pointer' : 'not-allowed', opacity: dmg > 0 ? 1 : 0.4, fontSize: 11 }} disabled={!(dmg > 0)}>-</button>
                                                        </div>
                                                    </div>
                                                );
                                            });
                                        })}
                                    </div>,
                                    document.body
                                )}
                            </div>

                            {/* Command Zone */}
                            <div className="bg-blue-900/80 backdrop-blur-sm p-3 rounded-lg border border-blue-500/50 flex-shrink-0 shadow-lg"
                                onDrop={(e) => handleDropOnZone(e, 'command')}
                                onDragOver={(e) => e.preventDefault()}
                            >
                                <h4 className="text-blue-400 text-sm font-bold mb-2">Command Zone</h4>
                                <div className="flex flex-wrap gap-2 content-start">
                                    {myState.commandZone.map(card => (
                                        <div key={card.instanceId} draggable onDragStart={(e) => handleDragStart(e, card, 'command')} className="cursor-pointer flex-shrink-0 flex flex-col items-center group/cmdcard relative">
                                            <CardImage 
                                                src={card.image_url} 
                                                className="w-16 h-[90px] hover:brightness-110 transition-[filter] border border-yellow-500"
                                                onMouseEnter={() => setHoveredCard(card.image_url)}
                                                onMouseLeave={() => setHoveredCard(null)}
                                            />
                                            {card.isCommander && (
                                                <div className="text-yellow-400 text-[10px] font-bold mt-0.5">
                                                    Tax: +{(myState.cmdTax || {})[card.instanceId] || 0}
                                                </div>
                                            )}
                                            <button
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    // Commanders go to the stack like any non-land card, but leave
                                                    // the command zone (not the hand) - use playCard directly.
                                                    const stackEntry = { instanceId: card.instanceId, card, ownerId: user.uid, ownerName: getDeckCommanderDisplayName(deck) || (user.displayName || 'Player'), timestamp: Date.now() };
                                                    window.runTransaction(async (tx) => {
                                                        const snap = await tx.get(roomRef);
                                                        const currentStack = snap.exists() ? (snap.data().stack || []) : [];
                                                        tx.update(roomRef, { stack: [stackEntry, ...currentStack] });
                                                    });
                                                    updateMyState({
                                                        commandZone: myState.commandZone.filter(c => c.instanceId !== card.instanceId),
                                                        cmdTax: { ...(myState.cmdTax || {}), [card.instanceId]: ((myState.cmdTax || {})[card.instanceId] || 0) + 2 }
                                                    });
                                                }}
                                                className="w-full mt-0.5 bg-green-600 hover:bg-green-500 text-white text-[9px] font-bold py-0.5 rounded shadow opacity-0 group-hover/cmdcard:opacity-100 transition-opacity"
                                                title={`Cast ${card.name} from command zone`}
                                            >Play</button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <button onClick={handleLeaveGame} className="w-full bg-red-600 hover:bg-red-500 text-white px-3 py-2 rounded text-sm font-bold flex-shrink-0 shadow-lg">Leave Game</button>
                        </div>

                        {/* Right sidebar (Library / GY / Exile / action buttons) — top to just above hand */}
                        <div ref={myRightSidebarRef} style={{ position: 'absolute', top: 4, bottom: 4, right: 8 }} className="z-40 w-56 overflow-y-auto flex flex-col gap-2 scrollbar-hide">
                            {/* Library */}
                            <div 
                                className="bg-blue-900/80 backdrop-blur-sm p-3 rounded-lg border border-blue-500/50 cursor-pointer hover:bg-blue-900 flex-shrink-0 flex flex-col items-center justify-center relative shadow-lg"
                                onClick={(e) => setLibraryMenu({ x: e.clientX, y: e.clientY })}
                                onDrop={(e) => handleDropOnZone(e, 'library')}
                                onDragOver={(e) => e.preventDefault()}
                            >
                                <h4 className="text-blue-400 text-sm font-bold mb-2">Library ({myState.library.length})</h4>
                                <CardImage isBack={true} className="w-20 h-28" />
                            </div>

                            {/* Graveyard + Exile */}
                            <div className="flex gap-2 flex-shrink-0">
                                <div 
                                    className="bg-blue-900/80 backdrop-blur-sm p-2 rounded-lg border border-blue-500/50 cursor-pointer hover:bg-blue-900 flex-1 flex flex-col items-center justify-center shadow-lg"
                                    onClick={() => setViewingZone('graveyard')}
                                    onDrop={(e) => handleDropOnZone(e, 'graveyard')}
                                    onDragOver={(e) => e.preventDefault()}
                                >
                                    <h4 className="text-blue-400 text-xs font-bold mb-1">GY ({myState.graveyard.length})</h4>
                                    {myState.graveyard[0] ? (
                                        <CardImage src={myState.graveyard[0].image_url} className="w-12 h-16"
                                            onMouseEnter={() => setHoveredCard(myState.graveyard[0].image_url)}
                                            onMouseLeave={() => setHoveredCard(null)} />
                                    ) : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                                </div>
                                <div 
                                    className="bg-blue-900/80 backdrop-blur-sm p-2 rounded-lg border border-blue-500/50 cursor-pointer hover:bg-blue-900 flex-1 flex flex-col items-center justify-center shadow-lg"
                                    onClick={() => setViewingZone('exile')}
                                    onDrop={(e) => handleDropOnZone(e, 'exile')}
                                    onDragOver={(e) => e.preventDefault()}
                                >
                                    <h4 className="text-blue-400 text-xs font-bold mb-1">Exile ({myState.exile.length})</h4>
                                    {myState.exile[0] ? (
                                        <CardImage src={myState.exile[0].image_url} className="w-12 h-16"
                                            onMouseEnter={() => setHoveredCard(myState.exile[0].image_url)}
                                            onMouseLeave={() => setHoveredCard(null)} />
                                    ) : <div className="w-12 h-16 bg-black/50 rounded border border-gray-600"></div>}
                                </div>
                            </div>

                            {/* Action buttons */}
                            <div className="flex gap-2 flex-shrink-0">
                                <button onClick={drawCard} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg">Draw</button>
                                <button onClick={() => setTokenModalOpen(true)} className="flex-1 bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg">Token</button>
                                <button onClick={shuffleLibrary} className="flex-1 bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg">Shuffle</button>
                            </div>
                            <button onClick={() => setEmblemModalOpen(true)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded text-xs font-bold shadow-lg flex-shrink-0">
                                Emblems{myEmblems.length > 0 ? ` (${myEmblems.length})` : ''}
                            </button>
                        </div>
                    </div>{/* ── END MY HALF ── */}
                </div>
            );
        };

        // Timer Component for Room List
        const RoomTimer = ({ emptyAt }) => {
            const [timeLeft, setTimeLeft] = useState(0);

            useEffect(() => {
                if (!emptyAt) return;
                const updateTimer = () => {
                    const remaining = Math.max(0, emptyAt - Date.now());
                    setTimeLeft(remaining);
                };
                updateTimer();
                const interval = setInterval(updateTimer, 1000);
                return () => clearInterval(interval);
            }, [emptyAt]);

            if (!emptyAt) return null;

            const seconds = Math.floor(timeLeft / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            const isWarning = timeLeft < 60000;

            return (
                <div className={`text-xs ${isWarning ? 'text-red-400 timer-warning' : 'text-gray-400'}`}>
                    â±ï¸ {minutes}:{remainingSeconds.toString().padStart(2, '0')}
                </div>
            );
        };

        const App = ({ user }) => {
            const [view, setView] = useState('lobby');
            const [selectedDeck, setSelectedDeck] = useState(null);
            const [decks, setDecks] = useState([]);
            const [rooms, setRooms] = useState([]);
            const [currentRoomId, setCurrentRoomId] = useState(null);
            const [maxPlayers, setMaxPlayers] = useState(2); // Chosen by the host when creating a room (2-4)
            
            // --- REFACTOR: Use global db
            const db = window.db;
            const roomsCollectionRef = useMemo(() => window.collection(db, 'arena_rooms'), [db]);

            useEffect(() => {
                const loadDecks = async () => {
                    const deckCollection = window.collection(db, 'users', user.uid, 'decks');
                    const snapshot = await window.getDocs(deckCollection);
                    setDecks(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                };
                loadDecks();

                // Listen to rooms collection
                const unsubscribe = window.onSnapshot(roomsCollectionRef, (snapshot) => {
                    setRooms(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                // Cleanup interval for expired rooms
                const cleanupInterval = setInterval(async () => {
                    const now = Date.now();
                    const roomsSnapshot = await window.getDocs(roomsCollectionRef);
                    
                    roomsSnapshot.docs.forEach(async (docSnap) => {
                        const data = docSnap.data();
                        if (data.emptyAt && data.emptyAt <= now) {
                            console.log(`Deleting expired empty room: ${docSnap.id}`);
                            // --- REFACTOR: Also delete subcollection (though it should be empty)
                            try {
                                const stateQuery = window.query(window.collection(db, 'arena_rooms', docSnap.id, 'game_state'));
                                const stateSnapshot = await window.getDocs(stateQuery);
                                stateSnapshot.forEach(stateDoc => window.deleteDoc(stateDoc.ref));
                            } catch (e) {}
                            await window.deleteDoc(docSnap.ref);
                        }
                    });
                }, 10000);

                return () => {
                    unsubscribe();
                    clearInterval(cleanupInterval);
                };
            }, [db, user.uid, roomsCollectionRef]);

            useEffect(() => { lucide.createIcons(); }, [view, rooms, decks]);

            // --- REFACTOR: createRoom writes minimal data ---
            const createRoom = async () => {
                if (!selectedDeck) { alert("Select a deck first"); return; }
                const roomRef = await window.addDoc(roomsCollectionRef, {
                    host: user.uid, 
                    hostName: user.displayName || user.email.split('@')[0],
                    players: [user.uid], 
                    maxPlayers: maxPlayers,
                    createdAt: Date.now(),
                    emptyAt: null,
                    // REPLACED `playerDecks` with `playerInfo`
                    playerInfo: {
                        [user.uid]: {
                            deckId: selectedDeck.id,
                            deckName: selectedDeck.name,
                            commanderName: getDeckCommanderDisplayName(selectedDeck)
                        }
                    }
                });
                setCurrentRoomId(roomRef.id);
                setView('game');
            };

            // --- REFACTOR: joinRoom writes minimal data ---
            const joinRoom = async (roomId) => {
                if (!selectedDeck) { alert("Select a deck first"); return; }
                const roomRef = window.doc(db, 'arena_rooms', roomId);
                const room = rooms.find(r => r.id === roomId);
                if (!room) return;
                if (room.players.includes(user.uid)) { setCurrentRoomId(roomId); setView('game'); return; } // Already in this room (e.g. rejoining)
                const capacity = room.maxPlayers || 2;
                if (room.players.length >= capacity) { alert("This room is already full."); return; }

                await window.updateDoc(roomRef, { 
                    players: [...room.players, user.uid],
                    emptyAt: null,
                    // REPLACED `playerDecks` with `playerInfo`
                    [`playerInfo.${user.uid}`]: {
                        deckId: selectedDeck.id,
                        deckName: selectedDeck.name,
                        commanderName: getDeckCommanderDisplayName(selectedDeck)
                    }
                });
                setCurrentRoomId(roomId);
                setView('game');
            };

            const deleteRoom = async (roomId, e) => {
                e.stopPropagation();
                if(!confirm("Are you sure you want to delete this room?")) return;
                // --- REFACTOR: Must delete subcollection first ---
                try {
                    const stateQuery = window.query(window.collection(db, 'arena_rooms', roomId, 'game_state'));
                    const stateSnapshot = await window.getDocs(stateQuery);
                    stateSnapshot.forEach(stateDoc => window.deleteDoc(stateDoc.ref));
                } catch (e) { console.error("Error cleaning subcollection:", e); }
                
                await window.deleteDoc(window.doc(db, 'arena_rooms', roomId));
            };

            const clearMyRooms = async () => {
                if(!confirm("This will close ALL rooms where you are the host. Continue?")) return;
                const q = window.query(roomsCollectionRef, window.where('host', '==', user.uid));
                const snapshot = await window.getDocs(q);
                snapshot.forEach(async (docSnap) => {
                    await deleteRoom(docSnap.id, { stopPropagation: () => {} });
                });
            };

// ... (inside the App component)

            // --- REFACTOR: leaveGame must clean up game_state doc ---
            const leaveGame = async () => {
                if (currentRoomId) {
                    const roomRef = window.doc(db, 'arena_rooms', currentRoomId);
                    const myStateRef = window.doc(db, 'arena_rooms', currentRoomId, 'game_state', user.uid);
                    
                    // 1. Delete my game state document (Required to pass the new security rule check)
                    try { 
                        await window.deleteDoc(myStateRef); 
                        console.log("Successfully deleted my player state document.");
                    } catch(e) { 
                        // It's crucial for the user to leave, so we log the error but proceed.
                        console.error("Could not delete my player state document. This might be a temporary permission issue or the document already gone:", e); 
                    }
                    
                    // 2. Update the lobby doc
                    const roomSnap = await window.getDoc(roomRef); // Use getDoc for a single read
                    
                    if (roomSnap.exists()) {
                        const roomData = roomSnap.data();
                        const remainingPlayers = roomData.players.filter(p => p !== user.uid);
                        
                        let updatedPlayerInfo = { ...roomData.playerInfo };
                        delete updatedPlayerInfo[user.uid];

                        if (remainingPlayers.length === 0) {
                            // If I'm the last one, mark room for deletion
                            await window.updateDoc(roomRef, {
                                players: [],
                                playerInfo: {},
                                emptyAt: Date.now() + ROOM_TIMEOUT_MS
                            });
                            console.log("Room marked for cleanup timeout.");
                        } else {
                            // If opponent is still here, just remove me
                            await window.updateDoc(roomRef, {
                                players: remainingPlayers,
                                playerInfo: updatedPlayerInfo,
                                emptyAt: null // No longer empty
                            });
                            console.log("Player removed from room.");
                        }
                    }
                }
                
                setView('lobby');
                setCurrentRoomId(null);
            };

// ... (rest of the App component)

            if (view === 'game' && currentRoomId && selectedDeck) {
                return <GameSim deck={selectedDeck} onLeave={leaveGame} roomId={currentRoomId} />;
            }

            return (
                <div className="h-screen flex flex-col bg-gray-900">
                    <Header user={user} selectedDeck={selectedDeck} />
                    <div className="flex-grow p-8 overflow-y-auto">
                        <div className="max-w-6xl mx-auto">
                            <div className="mb-6">
                                <h2 className="text-3xl font-bold text-yellow-400 mb-4">Select Your Deck</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {decks.map(deck => (
                                        <div 
                                            key={deck.id} 
                                            onClick={() => setSelectedDeck(deck)}
                                            className={`p-4 rounded-lg cursor-pointer transition-all ${
                                                selectedDeck?.id === deck.id 
                                                    ? 'bg-yellow-600 border-2 border-yellow-400' 
                                                    : 'bg-gray-800 border border-gray-700 hover:border-yellow-500'
                                            }`}
                                        >
                                            <h3 className="font-bold text-white">{deck.name}</h3>
                                            <p className="text-sm text-gray-400">{deck.cards?.length || 0} cards</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <h2 className="text-2xl font-bold text-yellow-400 mb-4">Create Room</h2>
                                    <div className="flex flex-col gap-4">
                                        <div>
                                            <label className="block text-sm text-gray-400 mb-2">Number of Players</label>
                                            <div className="flex gap-2">
                                                {[2, 3, 4].map(n => (
                                                    <button
                                                        key={n}
                                                        onClick={() => setMaxPlayers(n)}
                                                        className={`flex-1 py-3 rounded-lg font-bold text-lg border-2 transition-all ${
                                                            maxPlayers === n
                                                                ? 'bg-yellow-600 border-yellow-400 text-white'
                                                                : 'bg-gray-800 border-gray-700 text-gray-300 hover:border-yellow-500'
                                                        }`}
                                                    >
                                                        {n}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        <button 
                                            onClick={createRoom}
                                            disabled={!selectedDeck}
                                            className="w-full bg-green-600 hover:bg-green-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-4 px-6 rounded-lg text-lg"
                                        >
                                            <i data-lucide="plus-circle" className="w-6 h-6 inline-block mr-2"></i>
                                            Create New Room
                                        </button>
                                        <button 
                                            onClick={clearMyRooms}
                                            className="w-full bg-red-900/50 hover:bg-red-800/80 border border-red-700 text-red-200 py-3 px-6 rounded-lg text-sm transition-colors"
                                        >
                                            <i data-lucide="trash-2" className="w-4 h-4 inline-block mr-2"></i>
                                            Clear My Rooms (Cleanup)
                                        </button>
                                    </div>
                                </div>

                                <div>
                                    <h2 className="text-2xl font-bold text-yellow-400 mb-4">Available Rooms</h2>
                                    <div className="space-y-2">
                                        {rooms.filter(r => r.players.length < (r.maxPlayers || 2)).map(room => (
                                            <div key={room.id} className={`bg-gray-800 p-4 rounded-lg border ${room.emptyAt ? 'border-red-500/50 bg-red-900/10' : 'border-gray-700'}`}>
                                                <div className="flex justify-between items-center">
                                                    <div>
                                                        <h3 className="font-bold text-white">{room.hostName}'s Room</h3>
                                                        {room.emptyAt ? (
                                                            <div className="flex items-center space-x-2 mt-1">
                                                                <span className="text-red-400 text-sm font-bold">Closing:</span>
                                                                <RoomTimer emptyAt={room.emptyAt} />
                                                            </div>
                                                        ) : (
                                                            <p className="text-sm text-gray-400">{room.players.length}/{room.maxPlayers || 2} players</p>
                                                        )}
                                                    </div>
                                                    
                                                    {room.host === user.uid ? (
                                                        <button 
                                                            onClick={(e) => deleteRoom(room.id, e)}
                                                            className="bg-red-600 hover:bg-red-500 text-white p-2 rounded"
                                                            title="Delete my room"
                                                        >
                                                            <i data-lucide="trash" className="w-5 h-5"></i>
                                                        </button>
                                                    ) : (
                                                        <button 
                                                            onClick={() => joinRoom(room.id)}
                                                            disabled={!selectedDeck || !!room.emptyAt}
                                                            className="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white px-4 py-2 rounded"
                                                        >
                                                            {room.emptyAt ? 'Closing' : 'Join'}
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                        {rooms.filter(r => r.players.length < (r.maxPlayers || 2)).length === 0 && (
                                            <p className="text-gray-500 text-center py-8">No rooms available</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
    </script>
</body>
</html>
